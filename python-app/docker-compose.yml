version: '3.8'

services:
  # Flask Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quote-api
    ports:
      - "8082:8082"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=quotesdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secret
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quote-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: quote-db
    environment:
      POSTGRES_DB: quotesdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d quotesdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - quote-network
    restart: unless-stopped

networks:
  quote-network:
    driver: bridge

volumes:
  postgres_data: